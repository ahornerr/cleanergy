turn_on:
  name: Turn on all outputs
  description: Turn AC and DC outputs ON

turn_off:
  name: Turn off all outputs
  description: Turn AC and DC outputs OFF

set_power_ac:
  name: Set AC output
  description: Set AC output state
  fields:
    state:
      name: State
      description: true=on, false=off
      default: true
      selector:
        boolean:

set_power_dc:
  name: Set DC output
  description: Set DC output state
  fields:
    state:
      name: State
      description: true=on, false=off
      default: true
      selector:
        boolean:
